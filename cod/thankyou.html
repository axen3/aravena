<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">

    <!-- SECURITY META -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
                   img-src 'self' data: https:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">

    <title>تم تأكيد الطلب! 🎉</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.04);
            --font: 'Tajawal', 'Segoe UI', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #e0e7ff 0%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-width: 480px;
            width: 100%;
            padding: 40px 32px 28px;
            text-align: center;
            opacity: 0;
            animation: fadeIn .5s forwards .2s;
        }

        .icon-circle {
            width: 80px; height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success), #34d399);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: #fff;
            opacity: 0; animation: bounceIn .6s forwards .5s;
            box-shadow: 0 8px 24px rgba(16,185,129,.35);
        }

        h1 {
            color: var(--text); font-size: 24px; font-weight: 800;
            margin-bottom: 6px; opacity: 0; animation: fadeIn .5s forwards .8s;
        }

        .order-id {
            font-size: 14px; color: var(--text-muted);
            margin-bottom: 20px; opacity: 0; animation: fadeIn .5s forwards .9s;
        }
        .order-id strong {
            color: var(--primary); font-weight: 800;
            direction: ltr; unicode-bidi: isolate; display: inline-block;
        }

        .summary {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 12px; padding: 16px 20px; margin: 20px 0;
            text-align: start; opacity: 0; animation: fadeIn .5s forwards 1.1s;
        }
        .summary h3 {
            font-size: 14px; color: var(--text-muted);
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 700; display: flex; align-items: center; gap: 8px;
        }
        .summary-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; padding: 5px 0; gap: 12px;
        }
        .summary-row .label { color: var(--text-muted); white-space: nowrap; }
        .summary-row .value { font-weight: 600; color: var(--text); text-align: end; }
        .summary-total {
            border-top: 2px dashed var(--border);
            margin-top: 8px; padding-top: 10px; font-size: 16px;
        }
        .summary-total .label { font-weight: 800; color: var(--text); }
        .summary-total .value { color: var(--error); font-weight: 800; font-size: 18px; }

        .instructions {
            background: #fffbeb; border: 1px solid #fde68a;
            border-radius: 12px; padding: 14px 16px; margin-top: 16px;
            text-align: start; opacity: 0; animation: fadeIn .5s forwards 1.3s;
        }
        .instructions p { margin: 0; font-size: 13px; color: var(--text); line-height: 1.7; }
        .instructions p + p { margin-top: 6px; }
        .instructions strong { color: #d97706; }
        .instructions i { color: #f59e0b; margin-inline-end: 4px; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 13px 32px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: #fff; text-decoration: none; border-radius: 12px;
            font-weight: 700; font-size: 15px; transition: .25s;
            margin-top: 20px; box-shadow: 0 4px 14px rgba(79,70,229,.3);
            opacity: 0; animation: fadeIn .5s forwards 1.5s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,70,229,.4); }

        .error-state { text-align: center; }
        .error-state .icon-circle { background: linear-gradient(135deg, var(--error), #f87171); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(.3); }
            50% { opacity: 1; transform: scale(1.1); }
            70% { transform: scale(.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="card" id="card"></div>

    <script>
        'use strict';

        let translations = {};

        async function loadTranslations() {
            try {
                const res = await fetch('data/langs.json', { cache: 'no-store' });
                translations = await res.json();
            } catch(e) {
                console.error("Failed to load langs", e);
            }
        }

        function applyLanguage() {
            const lang = document.documentElement.lang || 'ar';
            const dict = translations[lang] || {};
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (dict[key]) el.textContent = dict[key];
            });
        }

        async function init() {
            await loadTranslations();
            
            const card = document.getElementById('card');
            let orderData = null;

            try {
                const raw = sessionStorage.getItem('orderData');
                if (raw) orderData = JSON.parse(raw);
            } catch (e) { orderData = null; }

            if (!orderData || !orderData.token) {
                card.innerHTML = `
                    <div class="error-state">
                        <div class="icon-circle"><i class="fa-solid fa-circle-exclamation"></i></div>
                        <h1>لا يوجد طلب</h1>
                        <p style="color:#64748b;font-size:14px;margin:12px 0 20px">
                            لم يتم العثور على بيانات الطلب. يرجى تقديم طلب جديد.
                        </p>
                        <a href="index.html" class="btn">
                            <i class="fa-solid fa-arrow-right"></i>
                            العودة للمتجر
                        </a>
                    </div>
                `;
                sessionStorage.removeItem('orderData');
                return;
            }

            function s(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/<[^>]*>/g, '').replace(/[<>]/g, '').trim();
            }

            const orderId    = s(orderData.orderId || 'ORD-XXXXXX');
            const product    = s(orderData.product || 'منتج');
            const price      = s(String(orderData.total || orderData.price || '0'));
            const currency   = s(orderData.currency || 'درهم');
            const size       = s(orderData.size || '');
            const color      = s(orderData.color || '');
            const quantity   = s(String(orderData.quantity || '1'));

            let options = '—';
            const parts = [];
            if (size) parts.push(size);
            if (color) parts.push(color);
            if (parts.length) options = parts.join(' / ');

            card.innerHTML = `
                <div class="icon-circle"><i class="fa-solid fa-check"></i></div>
                <h1 data-key="thankyou_h1"></h1>
                <p class="order-id"><span data-key="order_ref"></span> <strong id="order-ref"></strong></p>

                <div class="summary">
                    <h3><i class="fa-solid fa-receipt"></i> <span data-key="order_summary"></span></h3>
                    <div class="summary-row">
                        <span class="label" data-key="product"></span>
                        <span class="value" id="s-product"></span>
                    </div>
                    <div class="summary-row">
                        <span class="label" data-key="size_color"></span>
                        <span class="value" id="s-options"></span>
                    </div>
                    <div class="summary-row">
                        <span class="label" data-key="quantity"></span>
                        <span class="value" id="s-qty"></span>
                    </div>
                    <div class="summary-row summary-total">
                        <span class="label" data-key="total_price"></span>
                        <span class="value" id="s-price"></span>
                    </div>
                </div>

                <div class="instructions">
                    <p><i class="fa-solid fa-phone-volume"></i> <strong data-key="next_step"></strong></p>
                    <p data-key="step_text"></p>
                </div>

                <a href="index.html" class="btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span data-key="continue_shop"></span>
                </a>
            `;

            // Apply translations from langs.json
            applyLanguage();

            // Inject sanitized text
            document.getElementById('order-ref').textContent  = orderId;
            document.getElementById('s-product').textContent  = product;
            document.getElementById('s-options').textContent  = options;
            document.getElementById('s-qty').textContent      = quantity;
            document.getElementById('s-price').textContent    = `${price} ${currency}`;

            // Clear one-time use token
            sessionStorage.removeItem('orderData');
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, '', window.location.pathname);
            }
        }

        init();
    </script>
</body>
    </html>
